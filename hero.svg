<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Siddharth Meka, Full-Stack and AI/ML Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0B1230"/>
      <stop offset="1" stop-color="#1A0B3B"/>
      <animate attributeName="x2" values="1;0.8;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sm-neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="sm-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22D3EE" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="sm-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#sm-bg)"/>
  <rect width="1000" height="300" fill="url(#sm-grid)"/>

  <!-- orbital geometry -->
  <g fill="none" stroke="#A855F7" stroke-opacity="0.35" transform="translate(840 150)">
    <circle r="95"/>
    <circle r="60" stroke="#22D3EE" stroke-opacity="0.35"/>
    <circle cx="95" r="5" fill="#22D3EE" stroke="none" filter="url(#sm-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-60" r="4" fill="#A855F7" stroke="none" filter="url(#sm-glow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- drawn circuit path -->
  <path d="M40 255 H220 L250 225 H520 L550 255 H960" fill="none" stroke="url(#sm-neon)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1200" stroke-dashoffset="1200" filter="url(#sm-glow)">
    <animate attributeName="stroke-dashoffset" values="1200;0;0;1200" keyTimes="0;0.45;0.8;1" dur="9s" repeatCount="indefinite"/>
  </path>

  <text x="50" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="#E6F1FF" letter-spacing="2">SIDDHARTH MEKA</text>
  <text x="52" y="188" font-family="'Courier New', Consolas, monospace" font-size="22" fill="#22D3EE">Full-Stack &amp; AI/ML Developer</text>
  <text x="52" y="218" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#A5B4FC" fill-opacity="0.85">B.Tech CSE · Seeking Software Development / AI-ML internships</text>

  <!-- glowing underline -->
  <rect x="52" y="152" width="260" height="3" rx="1.5" fill="url(#sm-neon)" filter="url(#sm-glow)">
    <animate attributeName="width" values="60;260;260;60" keyTimes="0;0.4;0.85;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
