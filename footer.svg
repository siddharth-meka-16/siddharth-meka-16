<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="100%" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sf-neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="sf-glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="90" fill="#050816"/>
  <path d="M0 30 H400 L420 50 H580 L600 30 H1000" fill="none" stroke="url(#sf-neon)" stroke-width="2" stroke-dasharray="1100" stroke-dashoffset="1100" filter="url(#sf-glow)">
    <animate attributeName="stroke-dashoffset" values="1100;0;0;1100" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="76" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="16" fill="#A5B4FC">Thanks for stopping by. Let's build something.</text>
</svg>
