name: Generate Burgundy Contribution Snake

on:
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch:     # manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: siddharth-meka-16
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#F8F0F3&color_dots=#190B12,#451126,#701A3D,#A24A70,#C77B9B

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg
          git diff --cached --quiet || git commit -m "chore: update contribution snake [skip ci]"
          git push
