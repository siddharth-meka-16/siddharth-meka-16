<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="LeetCode Algorithmic Mastery - 142 Problems Solved">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lc-card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14080F"/>
      <stop offset="60%" stop-color="#10070C"/>
      <stop offset="100%" stop-color="#0A0307"/>
    </linearGradient>

    <!-- Radial Hub Ambient Spotlight -->
    <radialGradient id="lc-spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#451126" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="hub-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C77B9B" flood-opacity="0.3"/>
    </filter>

    <!-- Progress Bar Gradients -->
    <linearGradient id="easy-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77B9B"/>
      <stop offset="100%" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="med-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>
    <linearGradient id="hard-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#451126"/>
      <stop offset="100%" stop-color="#A24A70"/>
    </linearGradient>

    <!-- Ring Gradients -->
    <linearGradient id="ring-easy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F0F3"/>
      <stop offset="100%" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="ring-med" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>
    <linearGradient id="ring-hard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C77B9B"/>
      <stop offset="100%" stop-color="#701A3D"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="280" rx="16" fill="url(#lc-card-bg)"/>

  <!-- Radial Hub Ambient Light -->
  <circle cx="175" cy="142" r="135" fill="url(#lc-spotlight)"/>

  <!-- ================= LEFT: CONCENTRIC RADIAL GAUGE ================= -->
  <g id="radial-hub">
    <!-- Ring 1 (Easy, Outer) -->
    <circle cx="175" cy="142" r="90" fill="none" stroke="#230E19" stroke-width="8.5"/>
    <circle cx="175" cy="142" r="90" fill="none" stroke="url(#ring-easy)" stroke-width="8.5"
            stroke-linecap="round" stroke-dasharray="340.2 225.3"
            transform="rotate(-90 175 142)"/>

    <!-- Ring 2 (Medium, Middle) -->
    <circle cx="175" cy="142" r="72" fill="none" stroke="#230E19" stroke-width="8.5"/>
    <circle cx="175" cy="142" r="72" fill="none" stroke="url(#ring-med)" stroke-width="8.5"
            stroke-linecap="round" stroke-dasharray="236.4 216.0"
            transform="rotate(-90 175 142)"/>

    <!-- Ring 3 (Hard, Inner) -->
    <circle cx="175" cy="142" r="54" fill="none" stroke="#230E19" stroke-width="8.5"/>
    <circle cx="175" cy="142" r="54" fill="none" stroke="url(#ring-hard)" stroke-width="8.5"
            stroke-linecap="round" stroke-dasharray="80.6 258.7"
            transform="rotate(-90 175 142)"/>

    <!-- Centerpiece Typography -->
    <g filter="url(#hub-shadow)">
      <text x="175" y="134" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="38" font-weight="700" fill="#F8F0F3">142</text>
    </g>
    <text x="175" y="154" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" fill="#C77B9B" letter-spacing="2.8">SOLVED</text>
    <text x="175" y="170" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="8.5" fill="#8E6B7A" letter-spacing="1">4,096 POOL</text>

    <!-- Gauge Legend -->
    <g transform="translate(0, 0)">
      <circle cx="75" cy="254" r="4" fill="#E5B5C7"/>
      <text x="85" y="258" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="700" fill="#E5B5C7">EASY 95</text>

      <circle cx="165" cy="254" r="4" fill="#C77B9B"/>
      <text x="175" y="258" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="700" fill="#C77B9B">MED 44</text>

      <circle cx="245" cy="254" r="4" fill="#A24A70"/>
      <text x="255" y="258" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="700" fill="#A24A70">HARD 3</text>
    </g>
  </g>

  <!-- ================= RIGHT: MASTERY BENTO PANEL ================= -->
  <g transform="translate(340, 24)">
    <!-- Container Box -->
    <rect width="636" height="232" rx="12" fill="#14080F" stroke="#451126" stroke-width="1.2"/>

    <!-- Subtle Inner Top Glow -->
    <rect width="636" height="1" fill="#701A3D" opacity="0.6"/>

    <!-- Header Line -->
    <text x="22" y="30" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#C77B9B" letter-spacing="2">ALGORITHMIC DISCIPLINE  ·  LEETCODE PROFILE</text>

    <!-- Handle & Rank Capsule Badge -->
    <g transform="translate(422, 14)">
      <rect width="192" height="24" rx="12" fill="#190B12" stroke="#701A3D" stroke-width="1.2"/>
      <!-- LeetCode hex icon -->
      <g transform="translate(14, 12) scale(0.65)">
        <path d="M0 -6 L5 -3 L5 3 L0 6 L-5 3 L-5 -3 Z" fill="none" stroke="#C77B9B" stroke-width="1.6"/>
        <path d="M-1.5 -1.5 L1.5 0 L-1.5 1.5" fill="none" stroke="#F8F0F3" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <text x="26" y="16" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="700" fill="#F8F0F3">@Siddharth_OP</text>
      <line x1="118" y1="4" x2="118" y2="20" stroke="#701A3D" stroke-width="1"/>
      <text x="126" y="16" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#C77B9B">TOP 30%</text>
    </g>

    <!-- Title & Subtitle -->
    <text x="22" y="60" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="20" font-weight="600" fill="#F8F0F3" letter-spacing="0.2">Data Structures &amp; Problem Solving</text>
    <text x="614" y="60" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#8E6B7A">GLOBAL RANK #1,251,979</text>

    <!-- ================= 3 PROGRESS BARS ================= -->
    <!-- Easy Bar -->
    <g transform="translate(22, 74)">
      <text x="0" y="14" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#E5B5C7" letter-spacing="1">EASY</text>
      <rect x="68" y="5" width="370" height="10" rx="5" fill="#1D0A14" stroke="#3D1224" stroke-width="1"/>
      <rect x="68" y="5" width="175" height="10" rx="5" fill="url(#easy-grad)"/>
      <text x="452" y="14" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#F8F0F3">95 <tspan fill="#8E6B7A" font-weight="400">/ 974</tspan></text>
      <text x="592" y="14" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#C77B9B">(9.8%)</text>
    </g>

    <!-- Medium Bar -->
    <g transform="translate(22, 102)">
      <text x="0" y="14" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#C77B9B" letter-spacing="1">MEDIUM</text>
      <rect x="68" y="5" width="370" height="10" rx="5" fill="#1D0A14" stroke="#3D1224" stroke-width="1"/>
      <rect x="68" y="5" width="162" height="10" rx="5" fill="url(#med-grad)"/>
      <text x="452" y="14" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#F8F0F3">44 <tspan fill="#8E6B7A" font-weight="400">/ 2,136</tspan></text>
      <text x="592" y="14" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#C77B9B">(2.1%)</text>
    </g>

    <!-- Hard Bar -->
    <g transform="translate(22, 130)">
      <text x="0" y="14" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#A24A70" letter-spacing="1">HARD</text>
      <rect x="68" y="5" width="370" height="10" rx="5" fill="#1D0A14" stroke="#3D1224" stroke-width="1"/>
      <rect x="68" y="5" width="55" height="10" rx="5" fill="url(#hard-grad)"/>
      <text x="452" y="14" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#F8F0F3">3 <tspan fill="#8E6B7A" font-weight="400">/ 986</tspan></text>
      <text x="592" y="14" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#C77B9B">(0.3%)</text>
    </g>

    <!-- ================= BOTTOM TELEMETRY STRIP ================= -->
    <g transform="translate(22, 168)">
      <!-- Metric 1: Acceptance Rate -->
      <g transform="translate(0, 0)">
        <rect width="186" height="48" rx="8" fill="#10070C" stroke="#701A3D" stroke-width="1"/>
        <text x="14" y="18" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#C77B9B" letter-spacing="1.2">ACCEPTANCE RATE</text>
        <text x="14" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#F8F0F3">71.5% <tspan font-size="9.5" font-weight="400" fill="#8E6B7A">(218/305)</tspan></text>
      </g>

      <!-- Metric 2: Active Streak -->
      <g transform="translate(202, 0)">
        <rect width="186" height="48" rx="8" fill="#10070C" stroke="#701A3D" stroke-width="1"/>
        <text x="14" y="18" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#C77B9B" letter-spacing="1.2">ACTIVE STREAK</text>
        <text x="14" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" font-weight="700" fill="#F8F0F3">🔥 11 DAYS <tspan font-size="9.5" font-weight="400" fill="#8E6B7A">active</tspan></text>
      </g>

      <!-- Metric 3: Total Active Days -->
      <g transform="translate(404, 0)">
        <rect width="190" height="48" rx="8" fill="#10070C" stroke="#701A3D" stroke-width="1"/>
        <text x="14" y="18" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#C77B9B" letter-spacing="1.2">TOTAL PRACTICE</text>
        <text x="14" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" font-weight="700" fill="#F8F0F3">78 DAYS <tspan font-size="9.5" font-weight="400" fill="#8E6B7A">logged</tspan></text>
      </g>
    </g>

    <!-- Bento Inner Moving Border -->
    <rect width="634" height="230" x="1" y="1" rx="11" fill="none"
          stroke="#C77B9B" stroke-width="2.2" stroke-linecap="round" opacity="0.45"
          stroke-dasharray="70 850" stroke-dashoffset="0" filter="url(#neon-glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-920" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect width="634" height="230" x="1" y="1" rx="11" fill="none"
          stroke="#F8F0F3" stroke-width="1.4" stroke-linecap="round"
          stroke-dasharray="70 850" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="0" to="-920" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outer Animated Neon Pink Moving Border -->
  
  <!-- Static Base Border -->
  <rect width="1000" height="280" rx="16" fill="none" stroke="#701A3D" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- Neon Glow Soft Filter Layer -->
  <rect width="998" height="278" x="1" y="1" rx="15" fill="none"
        stroke="#C77B9B" stroke-width="3" stroke-linecap="round" opacity="0.45"
        stroke-dasharray="150 2382" stroke-dashoffset="0" filter="url(#neon-glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2532" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Core Neon Moving Line -->
  <rect width="998" height="278" x="1" y="1" rx="15" fill="none"
        stroke="#F8F0F3" stroke-width="1.8" stroke-linecap="round"
        stroke-dasharray="150 2382" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-2532" dur="8s" repeatCount="indefinite"/>
  </rect>
    
</svg>
