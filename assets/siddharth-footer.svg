<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Siddharth - Building systems that can explain themselves">
  <defs>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#14080F"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="ft-spotlight" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#451126" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ft-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <!-- Animated Light Sheen Gradient for Footer Name -->
    <linearGradient id="ft-name-sheen" x1="-120%" y1="0%" x2="-20%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3"/>
      <stop offset="42%" stop-color="#F8F0F3"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#F8F0F3"/>
      <stop offset="100%" stop-color="#F8F0F3"/>
      <animate attributeName="x1" values="-120%; -120%; 140%; 140%" keyTimes="0; 0.25; 0.65; 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-20%; -20%; 240%; 240%" keyTimes="0; 0.25; 0.65; 1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="ft-aura-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C77B9B" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#701A3D" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#451126" flood-opacity="0.5"/>
    </filter>
    <filter id="text-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="1000" height="280" rx="16" fill="url(#ft-bg)"/>
  <rect width="1000" height="280" rx="16" fill="url(#ft-spotlight)"/>

  <!-- Subtle Starlight Constellation Particles -->
  <circle cx="160" cy="80" r="1.5" fill="#E5B5C7" opacity="0.4"/>
  <circle cx="280" cy="190" r="1.2" fill="#C77B9B" opacity="0.5"/>
  <circle cx="380" cy="70" r="1.8" fill="#F8F0F3" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="70" r="1.8" fill="#F8F0F3" opacity="0.6">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="90" r="1.5" fill="#E5B5C7" opacity="0.4"/>
  <circle cx="850" cy="180" r="1.2" fill="#C77B9B" opacity="0.5"/>
  <circle cx="500" cy="40" r="2.2" fill="#F8F0F3" opacity="0.75">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Ambient Pulsing Name Backlight -->
  <ellipse cx="500" cy="118" rx="260" ry="60" fill="#701A3D" opacity="0.38" filter="url(#text-glow)">
    <animate attributeName="opacity" values="0.25;0.65;0.25" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="240;270;240" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Giant Glowing Brand Name with Multi-Tier Aura & Sheen -->
  <text x="500" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="76" font-weight="700" fill="#C77B9B" opacity="0.7" filter="url(#ft-aura-glow)">
    Siddharth
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="76" font-weight="700" fill="url(#ft-name-sheen)" letter-spacing="1">Siddharth</text>

  <!-- Italic Subtitle -->
  <text x="500" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="18.5" font-style="italic" fill="#E5B5C7" opacity="0.95">Building systems that can explain themselves.</text>

  <!-- Precision Monospace Sub-Brand -->
  <text x="500" y="214" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#C77B9B" letter-spacing="4">ENGINEERING INTELLIGENCE  ·  DESIGNING EXPERIENCES</text>

  <!-- Subtle Accent Underline -->
  <line x1="320" y1="236" x2="680" y2="236" stroke="url(#ft-line)" stroke-width="1.3"/>

  <!-- Animated Neon Pink Moving Border -->
  
  <!-- Static Base Border -->
  <rect width="1000" height="280" rx="16" fill="none" stroke="#701A3D" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- Neon Glow Soft Filter Layer -->
  <rect width="998" height="278" x="1" y="1" rx="15" fill="none"
        stroke="#C77B9B" stroke-width="3" stroke-linecap="round" opacity="0.45"
        stroke-dasharray="160 2372" stroke-dashoffset="0" filter="url(#neon-glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2532" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Core Neon Moving Line -->
  <rect width="998" height="278" x="1" y="1" rx="15" fill="none"
        stroke="#F8F0F3" stroke-width="1.8" stroke-linecap="round"
        stroke-dasharray="160 2372" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-2532" dur="8s" repeatCount="indefinite"/>
  </rect>
    
</svg>
