<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="GitHub at a glance">
  <defs>
    <linearGradient id="glance-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14080F"/>
      <stop offset="60%" stop-color="#10070C"/>
      <stop offset="100%" stop-color="#190B12"/>
    </linearGradient>
    <radialGradient id="glance-glow" cx="0.25" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1000" height="270" rx="16" fill="url(#glance-bg)"/>
  <rect width="1000" height="270" rx="16" fill="url(#glance-glow)"/>

  <!-- Left Header -->
  <text x="36" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#C77B9B" letter-spacing="2">METRICS  ·  LIFETIME &amp; ANNUAL ACTIVITY</text>
  <text x="36" y="70" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="28" font-weight="600" fill="#F8F0F3">GitHub at a glance</text>

  <!-- Metric Rows (Matching Screenshot 1) -->
  
      <g transform="translate(36, 106)">
        <circle cx="12" cy="0" r="11" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
        <g transform="translate(12, 0)"><path d="M0 -6 L1.8 -1.8 L6 -1.8 L2.6 0.8 L3.8 5.2 L0 2.6 L-3.8 5.2 L-2.6 0.8 L-6 -1.8 L-1.8 -1.8 Z" fill="#C77B9B"/></g>
        <text x="32" y="4" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#E5B5C7">Total Stars Earned:</text>
        <line x1="260" y1="2" x2="390" y2="2" stroke="#451126" stroke-width="1" stroke-dasharray="2 4"/>
        <text x="440" y="5" text-anchor="end" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="17" font-weight="700" fill="#F8F0F3">6</text>
      </g>
      <g transform="translate(36, 136)">
        <circle cx="12" cy="0" r="11" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
        <g transform="translate(12, 0)"><circle cx="0" cy="0" r="5.5" fill="none" stroke="#C77B9B" stroke-width="1.3"/><path d="M0 -3 L0 0 L2.2 2.2" fill="none" stroke="#F8F0F3" stroke-width="1.3" stroke-linecap="round"/></g>
        <text x="32" y="4" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#E5B5C7">Total Commits (last year):</text>
        <line x1="260" y1="2" x2="390" y2="2" stroke="#451126" stroke-width="1" stroke-dasharray="2 4"/>
        <text x="440" y="5" text-anchor="end" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="17" font-weight="700" fill="#F8F0F3">57</text>
      </g>
      <g transform="translate(36, 166)">
        <circle cx="12" cy="0" r="11" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
        <g transform="translate(12, 0)"><circle cx="-3" cy="-3.5" r="1.8" fill="none" stroke="#C77B9B" stroke-width="1.2"/><circle cx="-3" cy="3.5" r="1.8" fill="none" stroke="#C77B9B" stroke-width="1.2"/><circle cx="3" cy="-0.8" r="1.8" fill="none" stroke="#C77B9B" stroke-width="1.2"/><path d="M-3 -1.7 L-3 1.7 M-3 0.8 C-1 0.8, 3 2.5, 3 1" fill="none" stroke="#C77B9B" stroke-width="1.2"/></g>
        <text x="32" y="4" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#E5B5C7">Total PRs:</text>
        <line x1="260" y1="2" x2="390" y2="2" stroke="#451126" stroke-width="1" stroke-dasharray="2 4"/>
        <text x="440" y="5" text-anchor="end" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="17" font-weight="700" fill="#F8F0F3">2</text>
      </g>
      <g transform="translate(36, 196)">
        <circle cx="12" cy="0" r="11" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
        <g transform="translate(12, 0)"><circle cx="0" cy="0" r="5.5" fill="none" stroke="#C77B9B" stroke-width="1.3"/><circle cx="0" cy="0" r="2" fill="#F8F0F3"/></g>
        <text x="32" y="4" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#E5B5C7">Total Issues:</text>
        <line x1="260" y1="2" x2="390" y2="2" stroke="#451126" stroke-width="1" stroke-dasharray="2 4"/>
        <text x="440" y="5" text-anchor="end" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="17" font-weight="700" fill="#F8F0F3">0</text>
      </g>
      <g transform="translate(36, 226)">
        <circle cx="12" cy="0" r="11" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
        <g transform="translate(12, 0)"><rect x="-4.5" y="-4.5" width="9" height="9" rx="1.8" fill="none" stroke="#C77B9B" stroke-width="1.2"/><line x1="-4.5" y1="-1" x2="4.5" y2="-1" stroke="#C77B9B" stroke-width="0.9"/><rect x="-1.8" y="-1" width="3.6" height="1.8" rx="0.5" fill="#F8F0F3"/></g>
        <text x="32" y="4" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#E5B5C7">Contributed to (last year):</text>
        <line x1="260" y1="2" x2="390" y2="2" stroke="#451126" stroke-width="1" stroke-dasharray="2 4"/>
        <text x="440" y="5" text-anchor="end" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="17" font-weight="700" fill="#F8F0F3">8</text>
      </g>

  <!-- Right Side Benchmark Bento Box -->
  <g transform="translate(500, 26)">
    <rect width="464" height="218" rx="12" fill="#14080F" stroke="#451126" stroke-width="1"/>
    <rect x="0" y="0" width="464" height="28" rx="12" fill="#190B12"/>
    <rect x="0" y="16" width="464" height="12" fill="#190B12"/>
    <line x1="0" y1="28" x2="464" y2="28" stroke="#451126" stroke-width="1"/>
    <text x="18" y="18" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" fill="#C77B9B" letter-spacing="1.5">DEVELOPER PROFILE SUMMARY</text>

    <!-- Radar / Activity Pulse in top corner -->
    <circle cx="436" cy="14" r="4" fill="#C77B9B">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Benchmark Lines -->
    <g transform="translate(20, 52)">
      <text x="0" y="0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#C77B9B" letter-spacing="1">SPECIALIZATION</text>
      <text x="0" y="18" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="15" font-weight="600" fill="#F8F0F3">Full-Stack AI &amp; Machine Learning</text>

      <text x="0" y="46" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#C77B9B" letter-spacing="1">ANNUAL CADENCE</text>
      <text x="0" y="64" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="15" font-weight="600" fill="#F8F0F3">57 Contributions across 8 Public Repos</text>

      <text x="0" y="92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#C77B9B" letter-spacing="1">PRODUCTION STACK</text>
      <text x="0" y="110" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="15" font-weight="600" fill="#F8F0F3">Next.js · React · FastAPI · Supabase · Python</text>

      <text x="0" y="138" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#C77B9B" letter-spacing="1">PROFILE AVAILABILITY</text>
      <text x="0" y="156" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="15" font-weight="600" fill="#E5B5C7">Open for Software &amp; AI/ML Internships</text>
    </g>

    <!-- Box Neon Moving Border -->
    <rect width="462" height="216" x="1" y="1" rx="11" fill="none"
          stroke="#C77B9B" stroke-width="2.2" stroke-linecap="round" opacity="0.45"
          stroke-dasharray="70 850" stroke-dashoffset="0" filter="url(#neon-glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-920" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect width="462" height="216" x="1" y="1" rx="11" fill="none"
          stroke="#F8F0F3" stroke-width="1.4" stroke-linecap="round"
          stroke-dasharray="70 850" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="0" to="-920" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outer Animated Neon Pink Moving Border -->
  
  <!-- Static Base Border -->
  <rect width="1000" height="270" rx="16" fill="none" stroke="#701A3D" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- Neon Glow Soft Filter Layer -->
  <rect width="998" height="268" x="1" y="1" rx="15" fill="none"
        stroke="#C77B9B" stroke-width="3" stroke-linecap="round" opacity="0.45"
        stroke-dasharray="150 2362" stroke-dashoffset="0" filter="url(#neon-glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2512" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Core Neon Moving Line -->
  <rect width="998" height="268" x="1" y="1" rx="15" fill="none"
        stroke="#F8F0F3" stroke-width="1.8" stroke-linecap="round"
        stroke-dasharray="150 2362" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-2512" dur="8s" repeatCount="indefinite"/>
  </rect>
    
</svg>
