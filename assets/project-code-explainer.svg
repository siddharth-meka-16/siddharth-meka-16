<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 118" width="1000" height="118" role="img" aria-label="AI Code Explainer Project Card">
  <defs>
    <linearGradient id="p-bg-project_code_explainer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="60%" stop-color="#14080F"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p-glow-project_code_explainer" cx="0.05" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="118" rx="14" fill="url(#p-bg-project_code_explainer)" stroke="#701A3D" stroke-opacity="0.8" stroke-width="1.2"/>
  <rect width="1000" height="118" rx="14" fill="url(#p-glow-project_code_explainer)"/>

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="4" height="70" rx="2" fill="#C77B9B"/>

  <!-- Project Icon container with animated micro-demo -->
  <g transform="translate(54, 42)">
    <circle cx="0" cy="0" r="24" fill="#10070C" stroke="#701A3D" stroke-width="1.2"/>
    
        <!-- Scanning Laser Beam -->
        <rect x="-24" y="-18" width="48" height="2" rx="1" fill="#C77B9B" opacity="0.9">
          <animate attributeName="y" values="-20;20;-20" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/>
        </rect>
        <!-- Code Brackets with breathing scale -->
        <g>
          <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2.5s" repeatCount="indefinite"/>
          <path d="M -7 -7 L -13 0 L -7 7 M 7 -7 L 13 0 L 7 7" fill="none" stroke="#C77B9B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="2" y1="-9" x2="-2" y2="9" stroke="#E5B5C7" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        
  </g>

  <!-- Title & Subtitle -->
  <text x="96" y="38" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="26" font-weight="600" fill="#F8F0F3" letter-spacing="0.5">AI Code Explainer</text>
  <text x="96" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#E5B5C7" opacity="0.9">AI-Powered Code Analysis &amp; Optimization Platform</text>

  <!-- Right Metric / Live Status Pill -->
  
        <g transform="translate(740, 24)">
          <rect width="230" height="28" rx="14" fill="#10070C" stroke="#701A3D" stroke-width="1"/>
          <!-- animated scan dot -->
          <circle cx="16" cy="14" r="4" fill="#C77B9B">
            <animate attributeName="r" values="3.5;5;3.5" dur="1.8s" repeatCount="indefinite"/>
          </circle>
          <text x="32" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#E5B5C7" letter-spacing="1">AST &amp; COMPLEXITY</text>
          <text x="175" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#C77B9B" opacity="0.85">GEMINI</text>
        </g>
        

  <!-- Tags -->
  <g>
    
    <g transform="translate(30, 76)">
      <rect width="62" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="31.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">React</text>
    </g>
    <g transform="translate(102, 76)">
      <rect width="78" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="39.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">FastAPI</text>
    </g>
    <g transform="translate(190, 76)">
      <rect width="102" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="51.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">Gemini API</text>
    </g>
    <g transform="translate(302, 76)">
      <rect width="70" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="35.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">Python</text>
    </g>
    <g transform="translate(382, 76)">
      <rect width="118" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="59.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">AST Analyzer</text>
    </g>
  </g>
</svg>
