<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="sh-title sh-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="sh-title">SIDDHARTH MEKA</title>
  <desc id="sh-desc">Siddharth Meka. Computer Science Engineering, AI/ML and Full-Stack Development. Burgundy animated hero banner.</desc>
  <defs>
    <linearGradient id="sh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/><stop offset="0.55" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="sh-glow" cx="0.82" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.6"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sh-clip"><rect width="1000" height="520" rx="16"/></clipPath>
    <linearGradient id="sh-bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/><stop offset="0.5" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/>
      <animate attributeName="x2" values="1;0.82;1" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="sh-arch" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.85"/><stop offset="0.7" stop-color="#451126" stop-opacity="0.6"/><stop offset="1" stop-color="#190B12" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="sh-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/><stop offset="0.6" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh-mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <!-- Animated Light Sheen Gradients for Name -->
    <linearGradient id="sh-sheen-sid" x1="-120%" y1="0%" x2="-20%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3"/>
      <stop offset="42%" stop-color="#F8F0F3"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#F8F0F3"/>
      <stop offset="100%" stop-color="#F8F0F3"/>
      <animate attributeName="x1" values="-120%; -120%; 140%; 140%" keyTimes="0; 0.25; 0.65; 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-20%; -20%; 240%; 240%" keyTimes="0; 0.25; 0.65; 1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sh-sheen-meka" x1="-120%" y1="0%" x2="-20%" y2="0%">
      <stop offset="0%" stop-color="#E5B5C7"/>
      <stop offset="42%" stop-color="#E5B5C7"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#E5B5C7"/>
      <animate attributeName="x1" values="-120%; -120%; 140%; 140%" keyTimes="0; 0.3; 0.7; 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-20%; -20%; 240%; 240%" keyTimes="0; 0.3; 0.7; 1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="sh-grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#C77B9B" stroke-opacity="0.07"/></pattern>
    <pattern id="sh-gridm" width="125" height="125" patternUnits="userSpaceOnUse"><path d="M125 0H0V125" fill="none" stroke="#C77B9B" stroke-opacity="0.12"/></pattern>
    <radialGradient id="sh-fade" cx="0.75" cy="0.45" r="0.75"><stop offset="0.1" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="sh-gridmask"><rect width="1000" height="520" fill="url(#sh-fade)"/></mask>
    <filter id="sh-soft" x="-30%" y="-400%" width="160%" height="900%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="sh-dot" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <g clip-path="url(#sh-clip)">
    <rect width="1000" height="520" fill="url(#sh-bg2)"/>
    <ellipse cx="800" cy="240" rx="420" ry="300" fill="url(#sh-glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <g mask="url(#sh-gridmask)"><rect width="1000" height="520" fill="url(#sh-grid)"/><rect width="1000" height="520" fill="url(#sh-gridm)"/></g>
    <!-- orbits around the arch -->
    <circle cx="800" cy="262" r="205" fill="none" stroke="#C77B9B" stroke-opacity="0.2"/>
    <circle cx="800" cy="262" r="250" fill="none" stroke="#C77B9B" stroke-opacity="0.16" stroke-dasharray="1 7" stroke-linecap="round"/>
    <g><circle cx="1005" cy="262" r="4.5" fill="#E5B5C7"/><circle cx="1005" cy="262" r="8" fill="#C77B9B" opacity="0.55" filter="url(#sh-dot)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 800 262" to="360 800 262" dur="42s" repeatCount="indefinite"/></g>
    <g><circle cx="595" cy="262" r="3" fill="#C77B9B"/>
      <animateTransform attributeName="transform" type="rotate" from="0 800 262" to="-360 800 262" dur="66s" repeatCount="indefinite"/></g>
    <!-- arch frame -->
    <path d="M705 410V225A95 95 0 0 1 895 225V410Z" fill="url(#sh-arch)" stroke="#C77B9B" stroke-opacity="0.45" stroke-width="1.2"/>
    <path d="M717 398V225A83 83 0 0 1 883 225V398Z" fill="none" stroke="#C77B9B" stroke-opacity="0.18"/>
    <path d="M705 410V225A95 95 0 0 1 895 225V410Z" fill="none" stroke="#E5B5C7" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="130 720" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="0" to="-850" dur="9s" repeatCount="indefinite"/>
    </path>
    <text x="800" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-style="italic" font-size="92" fill="url(#sh-mono)">SM</text>
    <text x="800" y="380" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" letter-spacing="3" fill="#C77B9B">CSE · 2024–2028</text>
    <!-- registration marks -->
    <g fill="none" stroke="#C77B9B" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="square">
      <path d="M28 52V28H52"/><path d="M948 28H972V52"/><path d="M28 468V492H52"/><path d="M972 468V492H948"/>
    </g>
    <!-- path chip -->
    <rect x="60" y="46" width="214" height="32" rx="16" fill="#190B12" stroke="#701A3D"/>
    <circle cx="80" cy="62" r="4" fill="#C77B9B"/>
    <text x="96" y="67" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="0.5" fill="#E5B5C7">~/siddharth-meka</text>
    <!-- eyebrow -->
    <rect x="60" y="121" width="34" height="2" fill="#C77B9B"/>
    <text x="104" y="127" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="3.5" fill="#C77B9B">CSE · AI/ML · FULL-STACK</text>
    <!-- name with staggered float entrance & ambient sheen -->
    <g id="sh-name-group">
      <!-- Siddharth -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 18; 0 0" keyTimes="0; 1" dur="1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        <animate attributeName="opacity" values="0; 1" keyTimes="0; 1" dur="1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        <text x="56" y="226" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="94" letter-spacing="-1" fill="url(#sh-sheen-sid)">Siddharth</text>
      </g>
      <!-- Meka. -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 18; 0 18; 0 0" keyTimes="0; 0.22; 1" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0 0 1 1; 0.16 1 0.3 1"/>
        <animate attributeName="opacity" values="0; 0; 1" keyTimes="0; 0.22; 1" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0 0 1 1; 0.16 1 0.3 1"/>
        <text x="56" y="318" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-style="italic" font-size="94" letter-spacing="-1" fill="url(#sh-sheen-meka)">Meka<tspan fill="#C77B9B" font-style="normal">.<animate attributeName="fill" values="#C77B9B; #FFFFFF; #C77B9B" dur="3s" begin="1.2s" repeatCount="indefinite"/></tspan></text>
      </g>
    </g>

    <!-- Accent rule expanding out smoothly -->
    <rect x="60" y="336" width="320" height="4" rx="2" fill="url(#sh-rule)" filter="url(#sh-soft)">
      <animate attributeName="width" values="0; 0; 320" keyTimes="0; 0.3; 1" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0 0 1 1; 0.16 1 0.3 1"/>
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="6s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="337" width="320" height="2" rx="1" fill="url(#sh-rule)">
      <animate attributeName="width" values="0; 0; 320" keyTimes="0; 0.3; 1" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0 0 1 1; 0.16 1 0.3 1"/>
    </rect>
    <!-- positioning -->
    <text x="60" y="378" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="21" letter-spacing="3" fill="#E5B5C7">COMPUTER SCIENCE ENGINEERING</text>
    <text x="60" y="409" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="21" letter-spacing="3" fill="#C77B9B">AI/ML  |  FULL-STACK DEVELOPMENT</text>
    <text x="60" y="452" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-style="italic" font-size="24" fill="#F8F0F3" fill-opacity="0.88">Building practical AI-powered applications.</text>
    <!-- meta strip -->
    <rect x="60" y="474" width="880" height="1" fill="#C77B9B" fill-opacity="0.25"/>
    <text x="60" y="498" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" letter-spacing="1.5" fill="#E5B5C7" fill-opacity="0.8">B.TECH CSE · PRASAD V POTLURI SIDDHARTHA INSTITUTE OF TECHNOLOGY · ANDHRA PRADESH, INDIA</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="519" rx="16" fill="none" stroke="#701A3D" stroke-opacity="0.85"/>
</svg>
