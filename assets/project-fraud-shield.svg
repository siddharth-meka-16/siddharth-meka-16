<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 336" width="1000" height="336" role="img" aria-label="Fraud Shield Showcase">
  <defs>
    <linearGradient id="lxc-bg-project_fraud_shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14080F"/>
      <stop offset="60%" stop-color="#10070C"/>
      <stop offset="100%" stop-color="#190B12"/>
    </linearGradient>
    <radialGradient id="lxc-glow-project_fraud_shield" cx="0.85" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="336" rx="16" fill="url(#lxc-bg-project_fraud_shield)"/>
  <rect width="1000" height="336" rx="16" fill="url(#lxc-glow-project_fraud_shield)"/>

  <!-- Left Accent Notch -->
  <rect x="0" y="32" width="4" height="64" rx="2" fill="#C77B9B"/>

  <!-- Eyebrow -->
  <text x="36" y="44" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#C77B9B" letter-spacing="2">03 — MACHINE LEARNING — 2024</text>

  <!-- Title -->
  <text x="36" y="80" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="32" font-weight="700" fill="#F8F0F3" letter-spacing="0.3">Fraud Shield</text>

  <!-- One-liner Description -->
  <text x="36" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#E5B5C7" opacity="0.95">AI Fraud Detection System on Imbalanced Financial Streams</text>

  <!-- BUILT Highlight Strip -->
  <g transform="translate(36, 118)">
    <rect width="560" height="25" rx="6" fill="#190B12" stroke="#451126" stroke-width="0.9"/>
    <rect x="0" y="0" width="54" height="25" rx="6" fill="#701A3D"/>
    <text x="27" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="700" fill="#F8F0F3" letter-spacing="1">BUILT</text>
    <text x="66" y="16" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#E5B5C7">Random Forest + XGBoost benchmark + FastAPI risk server + Three.js UI</text>
  </g>

  <!-- Summary & Key Feature Bullets inside the card -->
  
    <g transform="translate(36, 164)">
      <circle cx="3" cy="-3.5" r="2.5" fill="#C77B9B"/>
      <text x="14" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5"><tspan font-weight="700" fill="#F8F0F3">Imbalanced ML: </tspan><tspan fill="#E5B5C7" opacity="0.9">End-to-end classifier benchmark on 0.17% skewed transaction data</tspan></text>
    </g>
    <g transform="translate(36, 185)">
      <circle cx="3" cy="-3.5" r="2.5" fill="#C77B9B"/>
      <text x="14" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5"><tspan font-weight="700" fill="#F8F0F3">Ensemble Benchmark: </tspan><tspan fill="#E5B5C7" opacity="0.9">Random Forest achieved 99.4% F1 &amp; 99.5% ROC-AUC over XGBoost</tspan></text>
    </g>
    <g transform="translate(36, 206)">
      <circle cx="3" cy="-3.5" r="2.5" fill="#C77B9B"/>
      <text x="14" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5"><tspan font-weight="700" fill="#F8F0F3">Real-Time Inference: </tspan><tspan fill="#E5B5C7" opacity="0.9">FastAPI risk server paired with interactive 3D Three.js UI</tspan></text>
    </g>

  <!-- 3 Big Metric Counters -->
  
      <g transform="translate(36, 254)">
        <text x="0" y="0" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="26" font-weight="700" fill="#F8F0F3">99.4%</text>
        <text x="0" y="15" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="500" fill="#C77B9B" letter-spacing="1">RANDOM FOREST F1</text>
      </g>
      <g transform="translate(211, 254)">
        <text x="0" y="0" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="26" font-weight="700" fill="#F8F0F3">99.5%</text>
        <text x="0" y="15" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="500" fill="#C77B9B" letter-spacing="1">ROC-AUC SCORE</text>
      </g>
      <g transform="translate(386, 254)">
        <text x="0" y="0" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="26" font-weight="700" fill="#F8F0F3">0.17%</text>
        <text x="0" y="15" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="500" fill="#C77B9B" letter-spacing="1">EXTREME FRAUD RATE</text>
      </g>

  <!-- Tech tags -->
  
      <g transform="translate(36, 292)">
        <rect width="61.2" height="22" rx="11" fill="#14080F" stroke="#451126" stroke-width="0.9"/>
        <text x="30.6" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#E5B5C7">Python</text>
      </g>
      <g transform="translate(105.2, 292)">
        <rect width="68.4" height="22" rx="11" fill="#14080F" stroke="#451126" stroke-width="0.9"/>
        <text x="34.2" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#E5B5C7">FastAPI</text>
      </g>
      <g transform="translate(181.60000000000002, 292)">
        <rect width="104.4" height="22" rx="11" fill="#14080F" stroke="#451126" stroke-width="0.9"/>
        <text x="52.2" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#E5B5C7">scikit-learn</text>
      </g>
      <g transform="translate(294.0, 292)">
        <rect width="68.4" height="22" rx="11" fill="#14080F" stroke="#451126" stroke-width="0.9"/>
        <text x="34.2" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#E5B5C7">XGBoost</text>
      </g>
      <g transform="translate(370.4, 292)">
        <rect width="90.0" height="22" rx="11" fill="#14080F" stroke="#451126" stroke-width="0.9"/>
        <text x="45.0" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#E5B5C7">JavaScript</text>
      </g>
      <g transform="translate(468.4, 292)">
        <rect width="75.6" height="22" rx="11" fill="#14080F" stroke="#451126" stroke-width="0.9"/>
        <text x="37.8" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#E5B5C7">Three.js</text>
      </g>

  <!-- Right Architecture Flow Diagram -->
  
      <!-- Architecture Flow: Imbalanced Stream -> Ensemble Pipeline -> Metric Gauge -->
      <g transform="translate(620, 38)">
        <rect width="344" height="258" rx="12" fill="#14080F" stroke="#451126" stroke-width="1"/>
        <text x="18" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#C77B9B" letter-spacing="1.5">CLASSIFIER BENCHMARK</text>
        
        <circle cx="316" cy="22" r="4" fill="#C77B9B">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>

        <!-- Dynamic Gauge Needle -->
        <g transform="translate(74, 114)">
          <path d="M -34 0 A 34 34 0 0 1 34 0" fill="none" stroke="#451126" stroke-width="7"/>
          <path d="M -34 0 A 34 34 0 0 1 24 -24" fill="none" stroke="#C77B9B" stroke-width="7"/>
          <circle cx="0" cy="0" r="4.5" fill="#F8F0F3"/>
          <line x1="0" y1="0" x2="18" y2="-20" stroke="#F8F0F3" stroke-width="2.2" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="-35 0 0; 35 0 0; 26 0 0; -35 0 0" dur="4s" repeatCount="indefinite"/>
          </line>
          <text x="0" y="24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#E5B5C7">99.4% F1</text>
        </g>

        <!-- Model Compare Bars on right -->
        <g transform="translate(156, 76)">
          <text x="0" y="10" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" fill="#C77B9B">RANDOM FOREST</text>
          <rect x="0" y="15" width="140" height="7" rx="3.5" fill="#451126"/>
          <rect x="0" y="15" width="138" height="7" rx="3.5" fill="#C77B9B"/>

          <text x="0" y="40" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" fill="#C77B9B">XGBOOST</text>
          <rect x="0" y="45" width="140" height="7" rx="3.5" fill="#451126"/>
          <rect x="0" y="45" width="131" height="7" rx="3.5" fill="#A24A70"/>

          <text x="0" y="70" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" fill="#C77B9B">LOGISTIC REG</text>
          <rect x="0" y="75" width="140" height="7" rx="3.5" fill="#451126"/>
          <rect x="0" y="75" width="102" height="7" rx="3.5" fill="#701A3D"/>
        </g>

        <!-- Bottom specs note -->
        <g transform="translate(18, 194)">
          <text x="0" y="14" font-family="'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#E5B5C7" font-weight="600">REAL-TIME RISK SERVER</text>
          <text x="0" y="27" font-family="'SFMono-Regular', Consolas, monospace" font-size="8.5" fill="#C77B9B" opacity="0.8">0.17% FRAUD BASE RATE · THREE.JS WEB CLIENT</text>
        </g>
      </g>

  <!-- Animated Neon Pink Moving Border -->
  
  <!-- Static Base Border -->
  <rect width="1000" height="336" rx="16" fill="none" stroke="#701A3D" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- Neon Glow Soft Filter Layer -->
  <rect width="998" height="334" x="1" y="1" rx="15" fill="none"
        stroke="#C77B9B" stroke-width="3" stroke-linecap="round" opacity="0.45"
        stroke-dasharray="150 2494" stroke-dashoffset="0" filter="url(#neon-glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2644" dur="7.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Core Neon Moving Line -->
  <rect width="998" height="334" x="1" y="1" rx="15" fill="none"
        stroke="#F8F0F3" stroke-width="1.8" stroke-linecap="round"
        stroke-dasharray="150 2494" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-2644" dur="7.5s" repeatCount="indefinite"/>
  </rect>
    
</svg>
