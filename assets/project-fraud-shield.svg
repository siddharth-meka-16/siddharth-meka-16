<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 114" width="1000" height="114" role="img" aria-label="Fraud Shield Project Card">
  <defs>
    <linearGradient id="p-bg-project_fraud_shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="60%" stop-color="#14080F"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p-glow-project_fraud_shield" cx="0.05" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="114" rx="14" fill="url(#p-bg-project_fraud_shield)" stroke="#701A3D" stroke-opacity="0.8" stroke-width="1.2"/>
  <rect width="1000" height="114" rx="14" fill="url(#p-glow-project_fraud_shield)"/>

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="4" height="66" rx="2" fill="#C77B9B"/>

  <!-- Project Icon container -->
  <g transform="translate(52, 40)">
    <circle cx="0" cy="0" r="22" fill="#10070C" stroke="#701A3D" stroke-width="1.2"/>
    
        <path d="M 0 -12 C 7 -12 11 -8 11 -2 C 11 7 4 12 0 15 C -4 12 -11 7 -11 -2 C -11 -8 -7 -12 0 -12 Z" fill="none" stroke="#C77B9B" stroke-width="1.5"/>
        <circle cx="0" cy="1" r="2.5" fill="#E5B5C7"/>
        
  </g>

  <!-- Title & Subtitle -->
  <text x="88" y="37" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="26" font-weight="600" fill="#F8F0F3" letter-spacing="0.5">Fraud Shield</text>
  <text x="88" y="56" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#E5B5C7" opacity="0.9">AI Fraud Detection System (99.4% F1 · 99.5% ROC-AUC)</text>

  <!-- Badge pill on top right -->
  <g transform="translate(830, 24)">
    <rect width="144" height="26" rx="13" fill="#10070C" stroke="#701A3D" stroke-width="1"/>
    <circle cx="15" cy="13" r="3.5" fill="#C77B9B">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="17" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" font-weight="600" fill="#E5B5C7" letter-spacing="1">MACHINE LEARNING</text>
  </g>

  <!-- Tags -->
  <g>
    
    <g transform="translate(30, 74)">
      <rect width="70" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="35.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">Python</text>
    </g>
    <g transform="translate(110, 74)">
      <rect width="78" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="39.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">FastAPI</text>
    </g>
    <g transform="translate(198, 74)">
      <rect width="118" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="59.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">scikit-learn</text>
    </g>
    <g transform="translate(326, 74)">
      <rect width="78" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="39.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">XGBoost</text>
    </g>
    <g transform="translate(414, 74)">
      <rect width="86" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="43.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">Three.js</text>
    </g>
