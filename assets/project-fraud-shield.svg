<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 118" width="1000" height="118" role="img" aria-label="Fraud Shield Project Card">
  <defs>
    <linearGradient id="p-bg-project_fraud_shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="60%" stop-color="#14080F"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p-glow-project_fraud_shield" cx="0.05" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="118" rx="14" fill="url(#p-bg-project_fraud_shield)" stroke="#701A3D" stroke-opacity="0.8" stroke-width="1.2"/>
  <rect width="1000" height="118" rx="14" fill="url(#p-glow-project_fraud_shield)"/>

  <!-- Left Accent Bar -->
  <rect x="0" y="24" width="4" height="70" rx="2" fill="#C77B9B"/>

  <!-- Project Icon container with animated micro-demo -->
  <g transform="translate(54, 42)">
    <circle cx="0" cy="0" r="24" fill="#10070C" stroke="#701A3D" stroke-width="1.2"/>
    
        <!-- Rotating dashed perimeter -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-dasharray="7 5">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        </circle>
        <!-- Center security shield -->
        <path d="M 0 -13 C 7 -13 12 -9 12 -3 C 12 7 5 13 0 16 C -5 13 -12 7 -12 -3 C -12 -9 -7 -13 0 -13 Z" fill="#190B12" stroke="#C77B9B" stroke-width="1.6"/>
        <circle cx="0" cy="1" r="3" fill="#E5B5C7">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        
  </g>

  <!-- Title & Subtitle -->
  <text x="96" y="38" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="26" font-weight="600" fill="#F8F0F3" letter-spacing="0.5">Fraud Shield</text>
  <text x="96" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#E5B5C7" opacity="0.9">AI Fraud Detection System (99.4% F1 · 99.5% ROC-AUC)</text>

  <!-- Right Metric / Live Status Pill -->
  
        <g transform="translate(740, 24)">
          <rect width="230" height="28" rx="14" fill="#10070C" stroke="#701A3D" stroke-width="1"/>
          <!-- Mini gauge arc -->
          <path d="M 12 18 A 6 6 0 0 1 24 18" fill="none" stroke="#701A3D" stroke-width="2"/>
          <line x1="18" y1="18" x2="18" y2="12" stroke="#E5B5C7" stroke-width="1.5" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="-40 18 18; 40 18 18; 32 18 18; -40 18 18" dur="4s" repeatCount="indefinite"/>
          </line>
          <text x="32" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#E5B5C7" letter-spacing="1">99.4% F1 SCORE</text>
          <text x="160" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#C77B9B" opacity="0.85">0.17% FRAUD</text>
        </g>
        

  <!-- Tags -->
  <g>
    
    <g transform="translate(30, 76)">
      <rect width="70" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="35.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">Python</text>
    </g>
    <g transform="translate(110, 76)">
      <rect width="78" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="39.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">FastAPI</text>
    </g>
    <g transform="translate(198, 76)">
      <rect width="118" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="59.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">scikit-learn</text>
    </g>
    <g transform="translate(326, 76)">
      <rect width="78" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="39.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">XGBoost</text>
    </g>
    <g transform="translate(414, 76)">
      <rect width="86" height="24" rx="12" fill="#10070C" stroke="#451126" stroke-width="1"/>
      <text x="43.0" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#E5B5C7">Three.js</text>
    </g>
  </g>
</svg>
