<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="Interactive Terminal — Siddharth Meka">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="term-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14080F"/>
      <stop offset="60%" stop-color="#10070C"/>
      <stop offset="100%" stop-color="#190B12"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="term-hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#14080F"/>
    </linearGradient>

    <!-- Master loop timer: 14s cycle -->
    <rect id="t_loop" width="0" height="0">
      <animate attributeName="width" from="0" to="100" dur="14s" repeatCount="indefinite"/>
    </rect>

    <!-- Clip path for Command 1: 'whoami' (width 0 to 100) -->
    <clipPath id="cp-cmd1">
      <rect x="230" y="55" width="0" height="30">
        <animate attributeName="width" from="0" to="120" dur="0.8s" begin="0.3s; t_loop.repeat(1)" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- Clip path for Command 2: 'cat current_stack.json' (width 0 to 280) -->
    <clipPath id="cp-cmd2">
      <rect x="230" y="135" width="0" height="30">
        <animate attributeName="width" from="0" to="260" dur="1.1s" begin="2.6s; t_loop.repeat(1)+2.3s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- Clip path for Command 3: 'python -m status' (width 0 to 220) -->
    <clipPath id="cp-cmd3">
      <rect x="230" y="215" width="0" height="30">
        <animate attributeName="width" from="0" to="220" dur="0.9s" begin="5.2s; t_loop.repeat(1)+4.9s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect width="1000" height="310" rx="14" fill="url(#term-bg)" stroke="#701A3D" stroke-width="1.2"/>

  <!-- Title bar -->
  <rect width="1000" height="36" rx="14" fill="url(#term-hdr)"/>
  <rect y="22" width="1000" height="14" fill="url(#term-hdr)"/>
  <line x1="0" y1="36" x2="1000" y2="36" stroke="#451126" stroke-width="1"/>

  <!-- Control dots -->
  <circle cx="26" cy="18" r="5.5" fill="#701A3D"/>
  <circle cx="44" cy="18" r="5.5" fill="#A24A70"/>
  <circle cx="62" cy="18" r="5.5" fill="#C77B9B"/>

  <!-- Title bar info -->
  <text x="500.0" y="22" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#C77B9B" letter-spacing="1" opacity="0.9">siddharth@workstation: ~ (zsh)</text>
  <text x="972" y="22" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="10" fill="#E5B5C7" letter-spacing="1" opacity="0.5">● zsh · 80x24 · UTF-8</text>

  <!-- ================= LINE 1 ================= -->
  <!-- Prompt 1 -->
  <text x="32" y="75" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#C77B9B" letter-spacing="0.5">siddharth@pvpsit:~$</text>
  
  <!-- Command 1 typed -->
  <g clip-path="url(#cp-cmd1)">
    <text x="230" y="75" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="500" fill="#F8F0F3">whoami</text>
  </g>

  <!-- Output 1 (fades in) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.3s; t_loop.repeat(1)+1.0s" fill="freeze"/>
    <text x="48" y="105" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#E5B5C7">
      <tspan fill="#F8F0F3" font-weight="600">Siddharth Meka</tspan> — B.Tech Computer Science (2024–2028) @ PVPSIT, Andhra Pradesh
    </text>
  </g>

  <!-- ================= LINE 2 ================= -->
  <!-- Prompt 2 (appears at 2.4s) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.4s; t_loop.repeat(1)+2.1s" fill="freeze"/>
    <text x="32" y="155" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#C77B9B" letter-spacing="0.5">siddharth@pvpsit:~$</text>
  </g>

  <!-- Command 2 typed -->
  <g clip-path="url(#cp-cmd2)">
    <text x="230" y="155" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="500" fill="#F8F0F3">cat current_stack.json</text>
  </g>

  <!-- Output 2 (fades in) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.9s; t_loop.repeat(1)+3.6s" fill="freeze"/>
    <text x="48" y="185" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#E5B5C7">
      <tspan fill="#C77B9B">&#123;</tspan> <tspan fill="#F8F0F3">"focus"</tspan>: [<tspan fill="#E5B5C7">"AI/ML"</tspan>, <tspan fill="#E5B5C7">"Full-Stack"</tspan>], <tspan fill="#F8F0F3">"core"</tspan>: [<tspan fill="#E5B5C7">"React"</tspan>, <tspan fill="#E5B5C7">"FastAPI"</tspan>, <tspan fill="#E5B5C7">"Gemini API"</tspan>, <tspan fill="#E5B5C7">"Java"</tspan>, <tspan fill="#E5B5C7">"Python"</tspan>] <tspan fill="#C77B9B">&#125;</tspan>
    </text>
  </g>

  <!-- ================= LINE 3 ================= -->
  <!-- Prompt 3 (appears at 5.0s) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="5.0s; t_loop.repeat(1)+4.7s" fill="freeze"/>
    <text x="32" y="235" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#C77B9B" letter-spacing="0.5">siddharth@pvpsit:~$</text>
  </g>

  <!-- Command 3 typed -->
  <g clip-path="url(#cp-cmd3)">
    <text x="230" y="235" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="500" fill="#F8F0F3">python -m status</text>
  </g>

  <!-- Output 3 (fades in with green pulse) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="6.3s; t_loop.repeat(1)+6.0s" fill="freeze"/>
    <circle cx="56" cy="261" r="4" fill="#C77B9B">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="265" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#F8F0F3" font-weight="600">
      [READY] <tspan fill="#E5B5C7">Actively shipping ResQ &amp; exploring SDE / AI internships for 2025–2026</tspan>
    </text>
  </g>

  <!-- Blinking Terminal Cursor -->
  <rect x="420" y="222" width="8" height="15" rx="1" fill="#C77B9B" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" dur="0.9s" begin="6.3s; t_loop.repeat(1)+6.0s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom Accent Status Line -->
  <line x1="20" y1="309" x2="980" y2="309" stroke="#701A3D" stroke-opacity="0.5" stroke-width="1"/>
</svg>
