      </g>
      <text x="52" y="32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#C77B9B" letter-spacing="1">ANTHROPIC</text>
