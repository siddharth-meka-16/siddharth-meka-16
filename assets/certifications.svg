      <text x="52" y="32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#C77B9B" letter-spacing="1">CISCO NETWORKING ACADEMY</text>
      <text x="52" y="52" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="15.5" font-weight="600" fill="#F8F0F3">Python Essentials 2</text>
      <text x="52" y="70" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#E5B5C7" opacity="0.8">ISSUED 2025  ·  INTERMEDIATE</text>
